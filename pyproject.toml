[project]
name = "rigorail"
version = "0.0.1"
description = "An experimental reusable framework for disciplined agentic software development."
readme = "README.md"
license = "MIT"
authors = [{ name = "Salah Chadli" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
